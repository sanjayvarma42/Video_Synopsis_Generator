<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>register form</title>

   <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.css">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

   <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>

  <div class="bs-example">
    <nav style="background-color: rgb(201, 18, 43);" class="navbar navbar-expand-md navbar-dark fixed-top">
      <a href="" class="navbar-brand"><i class=""></i>&nbsp; Video Summary Genetator</a>
      <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarCollapse">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">
        <div class="navbar-collapse collapse w-100 order-3 dual-collapse2">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" style="color: white;" href="register"><i class="fas fa-user"></i>&nbsp; Sign up</i></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" style="color: white;" href="{{ url_for('login') }}"><i class="fas fa-user-shield"></i>&nbsp; Log In</i></a>
                </li>     
            </ul>
        </div>
      </div>
    </nav>
  </div>

<div class="form-container">

   <form action="" method="post">
   <br>  
   <h3>Create Account</h3>
   
      <input type="text" name="fullname" required placeholder="Enter your Full Name">
      <input type="text" name="username" required placeholder="Enter your User Name">
      <input type="tel" name="phone" required pattern="[0-9]{10}" placeholder="Enter your Phone Number">
      <input type="email" name="email" required placeholder="Enter your Email">
      <input type="password" name="password" required placeholder="Enter your Password">
      <input type="password" name="cpassword" required placeholder="Confirm your Password">

      <input type="submit" name="submit" value="register now" class="form-btn">
      <p>Already have an account? <a href="{{ url_for('login') }}">Login now</a></p>
   </form>

</div>

</body>

</html>
